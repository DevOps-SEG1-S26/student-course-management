services:
  postgres:
    image: postgres:14.22-trixie
    restart: unless-stopped
    volumes:
      - std-volume-L1S23BSSE0001:/var/lib/postgresql/data
    networks:
      - std-net-L1S23BSSE0001
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  pgAdmin:
    image: dpage/pgadmin4:snapshot
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - std-net-L1S23BSSE0001
    depends_on:
      - postgres
  Adminer:
    image: adminer:standalone
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - std-net-L1S23BSSE0001
    depends_on:
      - postgres
    container_name: adminer-std-L1S23BSSE0001
networks:
  std-net-L1S23BSSE0001:
    driver: bridge
volumes:
  std-volume-L1S23BSSE0001:
    driver: local

services:
  PostgreSQL:
    image: postgres:14.22-trixie
    restart: unless-stopped
    volumes:
      - std-volume-L1S23BSSE0001:/var/lib/postgresql/data
    networks:
      - std-net-L1S23BSSE0001
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
networks:
  std-net-L1S23BSSE0001:
    driver: bridge
volumes:
  std-volume-L1S23BSSE0001:
    driver: local
